name: ecommerce-titulo-intermedio

services:
  postgres:
    image: postgres:16-alpine
    container_name: ti-ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce
    ports:
      - '5432:5432'
    volumes:
      - ti_ecommerce_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecommerce -d ecommerce']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: ti-ecommerce-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      - postgres

  # CU-20: Servicio de Correo local. Recibe por SMTP (:1025) todo lo que
  # manda el backend y lo muestra en una bandeja web (http://localhost:8025).
  mailpit:
    image: axllent/mailpit:latest
    container_name: ti-ecommerce-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  ti_ecommerce_pgdata:
